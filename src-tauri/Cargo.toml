[package]
name = "deepseek-harness-desktop"
version = "0.1.7"
description = "A self-contained Tauri desktop distribution of DeepSeek Harness"
authors = ["DSH Desktop contributors"]
license = "MIT"
repository = "https://github.com/peach-zhang/deepseek-harness-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
log = "0.4"
flate2 = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
ureq = "3"
url = "2.5.8"

[profile.dev]
# Dev builds of the windows/tauri crates produce multi-GB .lib/.pdb artifacts.
# Keep line tables (usable backtraces) but strip symbols and drop full debug
# info so `target` stays small and IDE indexing stays fast.
debug = "line-tables-only"
strip = true
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
