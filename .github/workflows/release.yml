name: Release desktop installers

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS Apple Silicon
            platform: macos-26
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel
            platform: macos-26-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install source dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare pinned self-contained runtime
        run: pnpm runtime:prepare -- --target ${{ matrix.target }}
      - name: Build and attach installers to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ vars.ENABLE_APPLE_SIGNING == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ vars.ENABLE_APPLE_SIGNING == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ vars.ENABLE_APPLE_SIGNING == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ vars.ENABLE_APPLE_SIGNING == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ vars.ENABLE_APPLE_SIGNING == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ vars.ENABLE_APPLE_SIGNING == 'true' && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: v__VERSION__
          releaseName: "DSH Desktop v__VERSION__"
          releaseBody: |
            Self-contained DSH Desktop installers.

            - Windows x64: choose the `.exe` installer (or `.msi` for managed deployment).
            - Apple Silicon Macs: choose the `aarch64` `.dmg`.
            - Intel Macs: choose the `x64` `.dmg`.

            Node.js and DeepSeek Harness are included. End users do not need npm, Node.js, or npx.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish-release:
    name: Publish completed release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub Release after every installer succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          gh release edit "v${VERSION}" --draft=false --repo "${GITHUB_REPOSITORY}"
